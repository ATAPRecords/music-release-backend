<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Creative Workspace — Prototype</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:#0b1020;color:#ecf1fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:242px;background:#10182b;border-right:1px solid #27324a;padding:24px 14px}main{margin-left:242px;padding:32px;max-width:1600px}.logo{font-size:21px;font-weight:800;letter-spacing:-.8px;margin:0 10px 30px}.logo b{color:#9c8cff}.muted{color:#95a4c1}.nav{display:block;width:100%;text-align:left;background:transparent;border:0;color:#a7b3cd;padding:12px 14px;border-radius:10px;margin-bottom:5px}.nav.active,.nav:hover{background:#263050;color:white}.switch{background:#19243d;border:1px solid #35415d;color:white;width:100%;border-radius:10px;padding:12px;margin-bottom:16px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:26px}h1{font-size:29px;letter-spacing:-1.1px;margin:0 0 7px}h2{font-size:17px;margin:0 0 15px}.pill{font-size:12px;padding:8px 12px;border-radius:99px;background:#202f46;color:#bbcaeb}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#151f34;border:1px solid #283751;border-radius:16px;padding:21px;min-width:0}.card strong.big{font-size:30px;display:block;margin:9px 0}.wide{grid-column:span 2}.full{grid-column:1/-1}.kicker{color:#96a6c4;font-size:13px}.item{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid #29374f}.item:last-child{border:0}.tag{color:#b9adff;background:#302951;border-radius:7px;padding:5px 8px;font-size:12px;white-space:nowrap}.btn{border:0;border-radius:10px;background:#826afa;color:white;padding:11px 15px;font-weight:700}.btn.secondary{background:#2a3954}.actions{display:flex;gap:10px;flex-wrap:wrap}input,select,textarea{background:#0c1629;color:white;border:1px solid #3b4d69;padding:11px;border-radius:9px;width:100%}label{font-size:13px;color:#a7b6d1;display:block;margin:14px 0 7px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.positive{color:#75d4b0}.notice{margin-top:15px;color:#75d4b0}.hero{background:linear-gradient(120deg,#2e235b,#192c53);border-radius:20px;padding:30px;margin-bottom:18px;border:1px solid #504785}.hero h2{font-size:25px}.small{font-size:12px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#91a4c4;font-size:12px;font-weight:500}.table td,.table th{padding:14px;border-bottom:1px solid #2b3952}.song{display:flex;align-items:center;gap:14px}.cover{width:46px;height:46px;border-radius:9px;background:linear-gradient(130deg,#7752d6,#1f90ae)}@media(max-width:900px){aside{position:static;width:auto;display:flex;overflow:auto;align-items:center;padding:10px}.logo{white-space:nowrap;margin:0 14px}.nav{width:auto;white-space:nowrap;margin:0}.switch{width:auto;margin:0 10px}main{margin:0;padding:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.formrow{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style></head><body>
<aside><div class="logo">NEXUS<b> / WORKSPACE</b></div><button id="mode" class="switch" onclick="toggleMode()">Business workspace ⇄</button><nav id="nav"></nav></aside>
<main><header><div><h1 id="heading">Today</h1><div class="muted" id="subheading">Your creative business, in one place.</div></div><span class="pill">● Interactive demo · Local sample data</span></header><div id="view"></div></main>
<script>
const business=['Today','Calendar','Clients','Jobs & tasks','Sessions','Payments','Files & review','Staff','Reports','Referrals'];
const client=['Home','Book a service','Projects','Music library','Review requests','Invoices','Release planner','Social calendar','Subscription','Help'];
let mode='business',page='Today';
let bookings=[{client:'Jordan Miles',service:'Recording session',date:'2026-11-13',time:'14:00',status:'Confirmed'},{client:'Avery Lane',service:'Mix & master',date:'2026-11-14',time:'11:00',status:'Confirmed'}];
let requests=[{title:'Entrance theme — high energy',client:'Jordan Miles',status:'New'},{title:'Mix revisions — single',client:'Avery Lane',status:'In progress'}];
let tracks=[{title:'Ignition',genre:'Rock',mood:'Hype',bpm:142,instrument:'Electric guitar',lyrics:'Rise above the fire, take the crown'},{title:'Midnight Signal',genre:'Electronic',mood:'Dark',bpm:118,instrument:'Synthesizer',lyrics:'Under the lights we move as one'},{title:'Afterglow',genre:'R&B',mood:'Calm',bpm:84,instrument:'Piano',lyrics:'Hold on until the morning comes'}];
const el=id=>document.getElementById(id);
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function box(title,body,cls=''){return '<section class="card '+cls+'"><h2>'+title+'</h2>'+body+'</section>'}
function lines(a,formatter){return a.map(formatter).join('')}
function nav(){el('nav').innerHTML=(mode==='business'?business:client).map(x=>'<button class="nav '+(x===page?'active':'')+'" onclick="go(\''+x.replace(/'/g,"\\'")+'\')">'+x+'</button>').join('');el('mode').textContent=mode==='business'?'◉ Nexus Studio · Business ⇄':'◉ Client portal ⇄';el('heading').textContent=page;el('subheading').textContent=mode==='business'?'Nexus Sound Studio operations':'Your projects, bookings, and creative assets'}
function go(p){page=p;render()}
function toggleMode(){mode=mode==='business'?'client':'business';page=mode==='business'?'Today':'Home';render()}
function bookingRows(){return lines(bookings,b=>'<div class="item"><div><strong>'+safe(b.client)+'</strong><div class="muted small">'+safe(b.service)+' · '+safe(b.date)+' at '+safe(b.time)+'</div></div><span class="tag">'+safe(b.status)+'</span></div>')}
function requestRows(){return lines(requests,r=>'<div class="item"><div><strong>'+safe(r.title)+'</strong><div class="muted small">'+safe(r.client)+'</div></div><span class="tag">'+safe(r.status)+'</span></div>')}
function stats(){return [['Upcoming sessions',bookings.length],['Active jobs',requests.length],['Unallocated payments','$125'],['Files awaiting review','3']].map(([t,n])=>box('<span class="kicker">'+t+'</span>','<strong class="big">'+n+'</strong>')).join('')}
function today(){return '<div class="hero"><h2>Good morning, Nexus Studio.</h2><p class="muted">Bookings, clients, projects, receipts, and delivery—one shared workspace.</p><button class="btn" onclick="go(\'Calendar\')">View schedule</button></div><div class="grid">'+stats()+box('Upcoming bookings',bookingRows(),'wide')+box('Active client requests',requestRows(),'wide')+'</div>'}
function calendar(){return '<div class="grid">'+box('Create a booking','<form onsubmit="addBooking(event)"><label>Client name</label><input name="client" required placeholder="Client name"><label>Service</label><select name="service"><option>Recording session</option><option>Mix & master</option><option>Video shoot</option></select><div class="formrow"><div><label>Date</label><input name="date" type="date" required min="2026-11-11"></div><div><label>Time</label><input name="time" type="time" required></div></div><label>Room</label><select name="room"><option>Studio A</option><option>Studio B</option></select><p><button class="btn" type="submit">Add demo booking</button></p></form><div id="bookingMsg" class="notice"></div>','wide')+box('Scheduled sessions',bookingRows(),'wide')+'</div>'}
function addBooking(e){e.preventDefault();let f=new FormData(e.target),b=Object.fromEntries(f);if(bookings.some(x=>x.date===b.date&&x.time===b.time&&x.room===b.room)){el('bookingMsg').textContent='Conflict: that room is already booked for this slot.';return}bookings.push({...b,status:'Demo booking'});render()}
function library(){return box('Find your next track','<input id="search" placeholder="Search title, any lyric word, instrument, genre, mood, BPM…" oninput="filterTracks()"><div id="results"></div>','full')}
function filterTracks(){let q=el('search').value.toLowerCase().trim(),found=tracks.filter(t=>Object.values(t).some(v=>String(v).toLowerCase().includes(q)));el('results').innerHTML=lines(found,t=>'<div class="item"><div class="song"><div class="cover"></div><div><strong>'+safe(t.title)+'</strong><div class="small muted">'+safe(t.genre)+' · '+safe(t.mood)+' · '+t.bpm+' BPM · '+safe(t.instrument)+'</div><div class="small muted">Lyric sample: '+safe(t.lyrics)+'</div></div></div><span class="tag">Demo track</span></div>')||'<p class="muted">No matching demo tracks.</p>'}
function musicRequests(){return box('Submit a custom music request','<form onsubmit="addRequest(event)"><label>Project / song request</label><input name="title" required placeholder="Entrance music for a wrestler"><label>Creative direction</label><textarea name="description" rows="4" placeholder="Genre, mood, tempo, references, deadline"></textarea><p><button class="btn">Send demo request</button></p></form>','wide')}
function addRequest(e){e.preventDefault();let f=new FormData(e.target);requests.push({title:f.get('title'),client:'You (demo client)',status:'New'});go('Projects')}
function clientHome(){return '<div class="hero"><h2>Your creative work, organized.</h2><p class="muted">Book a session, review a file, explore music, or request a custom track.</p><div class="actions"><button class="btn" onclick="go(\'Book a service\')">Book service</button><button class="btn secondary" onclick="go(\'Music library\')">Explore music</button></div></div><div class="grid">'+box('My projects',requestRows(),'wide')+box('Upcoming bookings',bookingRows(),'wide')+'</div>'}
function generic(){let desc={'Clients':'Client directory and permissions are next to connect to the backend.','Jobs & tasks':'Track production requests, assignments, and approval stages.','Sessions':'Log work time against real bookings once session APIs are connected.','Payments':'A verified receipt inbox and allocations ledger require secure provider integrations.','Files & review':'Uploads, versions, approvals, and restricted access are planned.','Staff':'Engineer assignments, availability and time off are planned.','Reports':'Revenue and operations reporting will use verified records.','Referrals':'Referral attribution and commission events are planned.','Review requests':'Client review and file-version approvals are planned.','Invoices':'Client balances and receipts will use the verified payment ledger.','Release planner':'Music distribution scheduling is a later integration milestone.','Social calendar':'Authorized social scheduling integrations are planned.','Subscription':'Subscriptions and usage caps will be developed after the first core workflow.','Help':'Client requests and support messaging are planned.'};return box(page,'<p class="muted">'+(desc[page]||'Module in design')+'</p>','full')}
function render(){nav();let html=mode==='business'?(page==='Today'?today():page==='Calendar'?calendar():page==='Jobs & tasks'?'<div class="grid">'+box('Production work queue',requestRows(),'wide')+musicRequests()+'</div>':generic()):(page==='Home'?clientHome():page==='Book a service'?calendar():page==='Projects'?'<div class="grid">'+box('Current projects',requestRows(),'wide')+musicRequests()+'</div>':page==='Music library'?library():generic());el('view').innerHTML=html;if(page==='Music library')filterTracks()}
render();
</script></body></html>
